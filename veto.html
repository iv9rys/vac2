<body>
    <script>
        (function() {
            if (localStorage.getItem("lightMode") === "true") document.body.classList.add("light");
            var ac = localStorage.getItem("accentColor");
            if (ac) {
                document.body.style.setProperty("--accent", ac);
                var r = parseInt(ac.slice(1,3),16), g = parseInt(ac.slice(3,5),16), b = parseInt(ac.slice(5,7),16);
                document.body.style.setProperty("--accent-rgb", r+", "+g+", "+b);
            }
        })();
    </script>
