<html lang="en">
<head>

<style>
/* ── Intro overlay ──────────────────────────────── */
#vac-intro {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #0d0d0d;
    transition: opacity 0.45s ease;
}
body.light #vac-intro { background: #f6f6f4; }

#vac-intro-crest {
    width: 200px; height: 200px;
    filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.35));
    transform-origin: center center;
}
#vac-intro-crest svg { width: 100%; height: 100%; overflow: visible; }

/* Shield: delay 0.25s, draws for 1.0s → done at 1.25s */
#intro-shield {
    stroke-dasharray: 240;
    stroke-dashoffset: 240;
    animation: vac-draw 1.0s cubic-bezier(0.35, 0, 0.15, 1) forwards 0.25s;
}
/* V: delay 1.15s, draws for 0.5s → done at 1.65s */
#intro-v {
    stroke-dasharray: 65;
    stroke-dashoffset: 65;
    animation: vac-draw 0.5s ease forwards 1.15s;
}
@keyframes vac-draw { to { stroke-dashoffset: 0; } }

/* Glow pulse when V finishes */
@keyframes vac-glow {
    0%   { filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.35)); }
    45%  { filter: drop-shadow(0 0 56px rgba(var(--accent-rgb), 0.70)); }
    100% { filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.35)); }
}

/* ── Home topbar on index ───────────────────────── */
#home-topbar {
    align-self: stretch;
    width: 100%;
    box-sizing: border-box;
    flex-shrink: 0;
}
</style>
</head>
<body class="home-body">
    <script>
        (function() {
            if (localStorage.getItem("lightMode") === "true") document.body.classList.add("light");
            var ac = localStorage.getItem("accentColor");
            if (ac) {
                document.body.style.setProperty("--accent", ac);
                var r = parseInt(ac.slice(1,3),16), g = parseInt(ac.slice(3,5),16), b = parseInt(ac.slice(5,7),16);
                document.body.style.setProperty("--accent-rgb", r+", "+g+", "+b);
            }
        })();
    </script>

    <!-- Topbar: hidden during intro, target for the crest to land in -->
    <div class="topbar" id="home-topbar" style="opacity:0; transition:opacity 0.3s ease; pointer-events:none;">
        <a href="index.html" class="logo-link" id="home-logo-target">
            <svg class="logo-crest" viewBox="12 9 76 82" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path stroke="var(--accent)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none"
                      d="M50 13 L83 25 V51 C83 73 50 88 50 88 C50 88 17 73 17 51 V25 Z"/>
                <path stroke="var(--accent)" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round" fill="none"
                      d="M36 39 L50 64 L66 39"/>
            </svg>
        </a>
    </div>

    <!-- Intro overlay: large animated crest -->
    <div id="vac-intro">
        <div id="vac-intro-crest">
            <svg viewBox="12 9 76 82" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path id="intro-shield" stroke="var(--accent)" stroke-width="5.5"
                      stroke-linejoin="round" stroke-linecap="round" fill="none"
                      d="M50 13 L83 25 V51 C83 73 50 88 50 88 C50 88 17 73 17 51 V25 Z"/>
                <path id="intro-v" stroke="var(--accent)" stroke-width="7"
                      stroke-linejoin="round" stroke-linecap="round" fill="none"
                      d="M36 39 L50 64 L66 39"/>
            </svg>
        </div>
    </div>

    <!-- Credit (revealed after intro) -->
    <div class="vac-credit" id="home-credit"
         style="opacity:0; animation:none; transition:opacity 0.55s ease;"
         aria-hidden="true">by &middot; iv9rys</div>

    <!-- Nav buttons (revealed after intro) -->
    <div class="home-content" id="home-content" style="opacity:0; transition:opacity 0.55s ease;">
        <div class="home-buttons">
            <a href="builder.html" class="home-btn">Open Comp Builder</a>
            <a href="comps.html" class="home-btn">View Saved Comps</a>
            <a href="veto.html" class="home-btn">Veto Tool</a>
            <a href="extra-tools.html" class="home-btn">Extra Tools</a>
            <a href="settings.html" class="home-btn">Settings</a>
        </div>
    </div>

    <div class="home-footer" id="home-footer" style="opacity:0; transition:opacity 0.55s ease;">
        <div class="footer-left">
            <a href="https://valoplant.gg/" target="_blank" rel="noopener" class="vlr-badge">
                valoplant<span class="vlr-dot">.gg</span>
            </a>
            <a href="https://www.vlr.gg/" target="_blank" rel="noopener" class="vlr-badge">
                VLR<span class="vlr-dot">.gg</span>
            </a>
        </div>
        <div class="footer-right">
            <a href="https://buymeacoffee.com/iv9rys4" target="_blank" rel="noopener" class="bmc-btn-sm">☕ Buy Me a Coffee</a>
            <div class="creator-text">
                created by <a href="https://x.com/iv9rys" class="creator-link" target="_blank" rel="noopener">@iv9rys</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var intro      = document.getElementById('vac-intro');
            var introCrest = document.getElementById('vac-intro-crest');
            var topbar     = document.getElementById('home-topbar');
            var logoTarget = document.getElementById('home-logo-target');

            // Phase: glow pulse when V finishes drawing (1.65s)
            setTimeout(function () {
                introCrest.style.animation = 'vac-glow 0.65s ease forwards';
            }, 1650);

            // Phase: fly to topbar logo position (after hold at 2.2s)
            setTimeout(function () {
                var logoRect  = logoTarget.getBoundingClientRect();
                var crestRect = introCrest.getBoundingClientRect();

                var targetCX  = logoRect.left  + logoRect.width  / 2;
                var targetCY  = logoRect.top   + logoRect.height / 2;
                var currentCX = crestRect.left + crestRect.width  / 2;
                var currentCY = crestRect.top  + crestRect.height / 2;
                var scale     = logoRect.height / crestRect.height;

                introCrest.style.transition =
                    'transform 0.65s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease 0.42s';
                introCrest.style.transform =
                    'translate(' + (targetCX - currentCX) + 'px,' + (targetCY - currentCY) + 'px) scale(' + scale + ')';
                introCrest.style.opacity = '0';

                // Reveal topbar
                topbar.style.opacity       = '1';
                topbar.style.pointerEvents = 'auto';

                // Reveal home content shortly after fly starts
                setTimeout(function () {
                    document.getElementById('home-content').style.opacity = '1';
                    document.getElementById('home-credit').style.opacity  = '1';
                    document.getElementById('home-footer').style.opacity  = '1';

                    // Fade out and remove the overlay
                    intro.style.opacity       = '0';
                    intro.style.pointerEvents = 'none';
                    setTimeout(function () { intro.remove(); }, 450);
                }, 420);

            }, 2200);
        })();
    </script>
</body>
</html>
